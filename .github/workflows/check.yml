# Runs on every pull request: the unit tests and the scan for things that must
# not be in a public repository. It has no secrets and can change nothing.
name: check
on:
  pull_request:
    branches: [dev, main]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: node scripts/scan.mjs --patterns-only
